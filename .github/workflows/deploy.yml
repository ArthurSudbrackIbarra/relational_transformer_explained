# Build the site, run the test suite, index the pages for search, and deploy dist/ to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # the search-index step installs Chromium itself

      - name: Test (engine, sampler, model parity)
        run: npm test

      - name: Build
        run: npm run build

      # The search index holds the rendered text of every page; rebuild it from this build so it
      # never lags the content. If this step fails, the committed public/search-index.json ships.
      - name: Search index
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          node scripts/search-index.mjs --out dist/search-index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
